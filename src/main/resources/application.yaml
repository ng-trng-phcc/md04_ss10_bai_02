spring:
  application:
    name: pharmacy-service
  config:
    import: optional:configserver:http://localhost:8888
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: all
      properties:
        enable.idempotence: true
        spring.json.trusted.packages: com.example.pharmacyservice.event
        spring.json.add.type.headers: false
  # fallback datasource nếu Config Server chưa sẵn sàng (giá trị chính từ pharmacy-service.yml trên GitHub)
  datasource:
    url: jdbc:postgresql://localhost:5432/pharmacy_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info
  endpoint:
    health:
      show-details: always

# fallback local nếu Config Server chưa có, giá trị thực từ Config Server (pharmacy-service.yml):
# app.branch-name=Nha Thuoc So 1, app.hotline=19001234 (spring.datasource.url đã cấu hình trên GitHub)
app:
  branch-name: "Nha Thuoc So 1"
  hotline: "19001234"

pharmacy:
  vat-rate: 10 # % VAT, giá trị chính từ Git (pharmacy-service.yml), refresh qua POST /actuator/refresh

# fallback Resilience4j khi Config Server chưa sẵn sàng, giá trị chính trên Git (pharmacy-service.yml):
# resilience4j.circuitbreaker.instances.warehouseCB.failure-rate-threshold=50
# resilience4j.circuitbreaker.instances.warehouseCB.wait-duration-in-open-state=20s
resilience4j:
  circuitbreaker:
    instances:
      warehouseCB:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
